<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welcome Back</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #111827;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 25px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #4b5563;
        }

        .remember input {
            width: auto;
            accent-color: #2563eb;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .signup {
            margin-top: 25px;
            color: #6b7280;
            font-size: 14px;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            color: #15803d;
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">L</div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Please enter your details to sign in.</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" id="forgotLink">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">
                Sign In
            </button>

            <p id="message" role="status"></p>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="#" id="signupLink">Sign up</a>
        </p>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        toggleButton.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "Show";
            }
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value;

            message.textContent =
                "Login form submitted successfully for " + email +
                ". This is a demo; authentication is not connected.";

            message.style.display = "block";
        });

        document.getElementById("forgotLink").addEventListener("click", function (event) {
            event.preventDefault();
            alert("Password recovery is not connected in this demo.");
        });

        document.getElementById("signupLink").addEventListener("click", function (event) {
            event.preventDefault();
            alert("Registration is not connected in this demo.");
        });
    </script>

</body>
</html>
